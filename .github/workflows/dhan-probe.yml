name: dhan-probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      DHAN_HEADERS_JSON: ${{ secrets.DHAN_HEADERS_JSON }}
      STATE_DIR: ${{ github.workspace }}/state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python setup_env.py
      - name: Dhan tick feed probe
        run: python dhan_probe.py
      - name: Keep the sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhan-probe
          path: out/dhan/
          retention-days: 30
          if-no-files-found: ignore
