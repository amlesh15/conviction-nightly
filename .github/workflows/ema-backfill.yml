name: ema-1226-backfill

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many past sessions to replay"
        default: "5"
      dry:
        description: "Dry run (print only, write nothing)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      SENSIBULL_COOKIE: ${{ secrets.SENSIBULL_COOKIE }}
      STATE_DIR: ${{ github.workspace }}/state
      BF_DAYS: ${{ inputs.days }}
      BF_DRY: ${{ inputs.dry }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python setup_env.py
      - name: Self-test
        run: python ema_backfill.py --selftest
      - name: Replay the EMA 12/26 + VWAP alerts
        run: python ema_backfill.py
