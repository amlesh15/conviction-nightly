name: oi-e2check

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      SENSIBULL_COOKIE: ${{ secrets.SENSIBULL_COOKIE }}
      STATE_DIR: ${{ github.workspace }}/state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt scikit-learn
      - run: python setup_env.py
      - name: Fetch the newest saved history (branch oi-archive, written by oi-universe)
        run: |
          git clone --depth 1 --branch oi-archive "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/arch
          LATEST=$(ls -d /tmp/arch/20* | sort | tail -1); echo "using $LATEST"
          mkdir -p out/oi/archive && cp "$LATEST"/* out/oi/archive/
          ls out/oi/archive | wc -l
      - name: E2 matched check
        run: python oi_e2check.py
      - name: Keep the result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oi-e2check
          path: out/oi/e2check.csv
          retention-days: 90
          if-no-files-found: ignore
