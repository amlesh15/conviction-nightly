name: imbalance-pine

on:
  workflow_dispatch: {}

permissions:
  contents: write        # commits the generated Pine file back to the repo

concurrency:
  group: imbalance-pine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python setup_env.py
      - name: Self-test
        run: python make_imbalance_pine.py --selftest
      - name: Update level log and build Pine script
        run: python make_imbalance_pine.py
      - name: Save the Pine script in the repo (open it on GitHub and press the copy button, no download)
        run: |
          mkdir -p pine
          cp imbalance_levels.pine pine/imbalance_levels.pine
          git config user.name  "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add pine/imbalance_levels.pine
          if git diff --cached --quiet; then echo "Pine script unchanged - nothing to commit"; exit 0; fi
          git commit -m "imbalance pine: update $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
