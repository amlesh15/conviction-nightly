name: imbalance-pine

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python setup_env.py
      - name: Self-test
        run: python make_imbalance_pine.py --selftest
      - name: Update level log and build Pine script
        run: python make_imbalance_pine.py
      - uses: actions/upload-artifact@v4
        with:
          name: imbalance-levels-pine
          path: imbalance_levels.pine
