name: oi-universe

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Test only: number of stocks (blank = all)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      SENSIBULL_COOKIE: ${{ secrets.SENSIBULL_COOKIE }}
      STATE_DIR: ${{ github.workspace }}/state
      OI_UNIVERSE_LIMIT: ${{ inputs.limit }}
      OI_BUDGET_MIN: "55"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python setup_env.py
      - name: OI event study + archive
        run: python oi_universe.py
      - name: Keep the files as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oi-universe
          path: out/oi/
          retention-days: 90
          if-no-files-found: ignore
      - name: Save history on the oi-archive branch (October contracts vanish after 27 Oct)
        if: always()
        run: |
          set +e
          [ -d out/oi/archive ] || exit 0
          git config --global user.name archive-bot
          git config --global user.email archive-bot@users.noreply.github.com
          rm -rf /tmp/arch
          if git ls-remote --exit-code --heads origin oi-archive >/dev/null 2>&1; then
            git clone --depth 1 --branch oi-archive "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/arch
          else
            git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/arch
            cd /tmp/arch && git checkout --orphan oi-archive && git rm -rf . >/dev/null 2>&1; cd -
          fi
          D=/tmp/arch/$(date +%F); mkdir -p "$D"; cp out/oi/archive/* "$D"/
          cd /tmp/arch && git add -A && git commit -m "OI archive $(date +%F)" && git push origin HEAD:oi-archive
