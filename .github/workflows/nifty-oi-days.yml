name: nifty-oi-days

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Dates, comma separated (blank = 2026-10-28,29,30)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      SENSIBULL_COOKIE: ${{ secrets.SENSIBULL_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python setup_env.py
      - name: Self-test
        run: python nifty_oi_day.py --selftest
      - name: Self-test (multi-day)
        run: python nifty_oi_days.py --selftest
      - name: Nifty option OI, several sessions
        run: python nifty_oi_days.py
        env:
          NOI_DATES: ${{ github.event.inputs.date }}
