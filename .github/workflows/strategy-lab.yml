name: strategy-lab

on:
  workflow_dispatch:
    inputs:
      cost_bps:
        description: "Round-trip trading cost in basis points (10 = 0.10%)"
        type: string
        default: "10"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      SENSIBULL_COOKIE: ${{ secrets.SENSIBULL_COOKIE }}
      STATE_DIR: ${{ github.workspace }}/state
      CACHE_DIR: ${{ github.workspace }}/fno_cache
      COST_BPS: ${{ inputs.cost_bps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt scikit-learn
      - name: Reuse downloaded NSE history (saves hours on later runs)
        uses: actions/cache@v4
        with:
          path: fno_cache
          key: fno-cache-${{ github.run_id }}
          restore-keys: fno-cache-
      - run: python setup_env.py
      - name: Strategy lab
        run: python strategy_lab.py
      - name: Keep the result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-lab
          path: out/strategy/
          retention-days: 60
          if-no-files-found: ignore
