name: oi-case

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Session to study, YYYY-MM-DD (blank = latest)"
        type: string
        default: ""
      windows:
        description: "Extra windows, e.g. 10:00-10:30,11:50-12:30"
        type: string
        default: "10:00-10:30,11:30-12:00,11:50-12:30"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      SENSIBULL_COOKIE: ${{ secrets.SENSIBULL_COOKIE }}
      STATE_DIR: ${{ github.workspace }}/state
      OI_DATE: ${{ inputs.date }}
      OI_WINDOWS: ${{ inputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python setup_env.py
      - name: FEDERALBNK OI case study
        run: python oi_case.py
      - name: Keep raw 1-minute data (the October contracts disappear after expiry)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oi-case-raw
          path: out/oi/
          retention-days: 90
          if-no-files-found: ignore
