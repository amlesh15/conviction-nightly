name: nifty-asof

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      DHAN_HEADERS_JSON: ${{ secrets.DHAN_HEADERS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python setup_env.py
      - name: Nifty zones date by date
        run: python nifty_asof.py
