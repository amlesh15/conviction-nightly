name: vcp

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = scanner + backtest (run after market close); intraday = 15-min VCP + live trigger (run in market hours)"
        type: choice
        options: [daily, intraday]
        default: daily

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      SENSIBULL_COOKIE: ${{ secrets.SENSIBULL_COOKIE }}
      STATE_DIR: ${{ github.workspace }}/state
      VCP_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python setup_env.py
      - name: VCP engine
        run: python vcp_engine.py
      - name: Keep result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcp-${{ inputs.mode }}
          path: out/vcp/
          retention-days: 30
          if-no-files-found: ignore
